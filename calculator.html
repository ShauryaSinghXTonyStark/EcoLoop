<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop - Carbon Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h2>📊 Carbon Intelligence</h2>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="marketplace.html">Marketplace</a>
                <a href="calculator.html" style="color: var(--primary);">Calculator</a>
                <a href="nature.html">Nature & Bio</a>
                <a href="ai.html">EcoAI Assistant</a>
                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
            </div>
        </nav>

        <div class="card">
            <h2>Smart Waste Impact & Carbon Calculator</h2>
            <label>Select Waste Category:</label>
            <select id="wasteType">
                <option value="organic">Organic Waste</option>
                <option value="plastic">Plastic Packaging</option>
                <option value="electronic">E-Waste</option>
            </select>
            <label>Quantity (in kg):</label>
            <input type="number" id="wasteAmount" placeholder="e.g., 20" min="1">
            <button onclick="calculate()">Compute Impact</button>
            <div id="result" class="card" style="margin-top: 15px; display:none; background: #ECFDF5; color: #065F46;"></div>
        </div>
    </div>
    <script>
        function calculate() {
            const amt = document.getElementById('wasteAmount').value;
            const type = document.getElementById('wasteType').value;
            if(!amt) { alert('Enter valid quantity'); return; }
            const co2 = (amt * 3.5).toFixed(2);
            const pts = amt * 15;
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.innerHTML = `✨ Saved <strong>${co2} kg CO₂</strong> and earned <strong>${pts} Eco-Points</strong>!`;
        }
        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }
    </script>
</body>
</html>
